apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: hello-world-agent
  description: A hello world AI agent that greets users by name. Serves as a minimal, reusable template for building future agents on the SAP BTP agent framework.

type: agent

agentCard:
  name: Hello World Agent
  version: 1.0.0
  description: Greets users by name using the A2A protocol. A reusable starting template for agent development.
  capabilities:
    skills:
      - name: greet-user
        description: Greets a user by name with a personalized message generated by an LLM.

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: hello-world-agent
      kind: a2a
      ordId: customer.build:apiResource:hello-world-agent-4daee.hello-world-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
